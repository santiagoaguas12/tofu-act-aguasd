name: Destroy OpenTofu Resources

on:
  workflow_dispatch:

jobs:
  destroy:
    name: Destroy AWS resources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Initialize OpenTofu
        env:
          TOFU_STATE_BUCKET: ${{ secrets.TOFU_STATE_BUCKET }}
        run: |
          printf '%s\n' 'terraform {' '  backend "s3" {}' '}' > backend.github.tf
          tofu init \
            -backend-config="bucket=$TOFU_STATE_BUCKET" \
            -backend-config="key=banking-transaction-processor/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Destroy OpenTofu resources
        run: tofu destroy -auto-approve
